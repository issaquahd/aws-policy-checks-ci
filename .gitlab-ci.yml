stages:
  - lint
  - validate

variables:
  TOFU_VERSION: "1.13.1"
  # Set to "true" in CI/CD variables (with AWS_ROLE_ARN) to run the optional job.
  ENABLE_ACCESS_ANALYZER: "false"
  AWS_REGION: "us-east-2"

cfn-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet cfn-lint
    - scripts/run-cfn-lint.sh

no-star-actions:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet pyyaml
    - scripts/run-policy-checks.sh

opentofu:
  stage: lint
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip ca-certificates >/dev/null
    - scripts/install-tofu.sh
  script:
    - scripts/run-tofu-checks.sh

# OPTIONAL: IAM Access Analyzer validate-policy using GitLab OIDC (id_tokens).
access-analyzer:
  stage: validate
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  rules:
    - if: '$ENABLE_ACCESS_ANALYZER == "true"'
  script:
    - >
      creds=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-$CI_PIPELINE_ID"
      --web-identity-token "$AWS_ID_TOKEN"
      --duration-seconds 900
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$creds" | cut -f1)
    - export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | cut -f2)
    - export AWS_SESSION_TOKEN=$(echo "$creds" | cut -f3)
    - scripts/validate-policies.sh
